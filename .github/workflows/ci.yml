name: Continuous Integration

on:
  push:
    branches: [Modeltinkering]
  pull_request:
    branches: [main, Modeltinkering]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongodb:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: --health-cmd="mongosh --eval 'db.adminCommand(\"ping\")'" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- Python setup ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-mock httpx

      - name: Lint with Ruff
        run: ruff check .

      - name: Type check with MyPy
        run: mypy --ignore-missing-imports config/ schemas/ services/ api/

      # --- Node.js setup ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: cd apps/web && npm install

      - name: TypeScript type check
        run: cd apps/web && npm run typecheck

      - name: Build frontend
        run: cd apps/web && npm run build

      # --- Tests ---
      - name: Wait for MongoDB
        run: |
          for i in {1..30}; do
            if mongosh --eval "db.adminCommand('ping')" > /dev/null 2>&1; then
              echo "MongoDB ready"
              break
            fi
            sleep 1
          done

      - name: Wait for Redis
        run: |
          for i in {1..10}; do
            if redis-cli ping > /dev/null 2>&1; then
              echo "Redis ready"
              break
            fi
            sleep 1
          done

      - name: Run unit tests
        env:
          MONGODB_URL: mongodb://localhost:27017
          REDIS_URL: redis://localhost:6379
          MONGODB_DATABASE: pm_ajay_test
          MOCK_MODE: "true"
        run: |
          python -m pytest tests/ -v --tb=short -x

      # --- Docker build test (no push) ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.app
          push: false
          load: true
          tags: pm-ajay-test:latest