#!KAMAILIO
# Minimal Kamailio SIP Gateway configuration for PM-AJAY

debug=2
log_stderror=no
memdbg=5
memlog=5

children=4
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060

loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483","Too Many Hops");
        exit;
    }

    if (is_method("INVITE")) {
        # Forward inbound SIP calls to FreeSWITCH
        rewritehostport("freeswitch:5060");
        t_relay();
        exit;
    }

    if (is_method("ACK")) {
        t_relay();
        exit;
    }

    sl_send_reply("404", "Not Found");
    exit;
}
